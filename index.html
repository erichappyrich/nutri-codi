<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>맞춤영양 코디</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#eef2f8;font-family:-apple-system,"Noto Sans KR",sans-serif}
#af{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
.ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1E3A6B;gap:14px;z-index:1}
.sp{width:34px;height:34px;border:3px solid #cdd8ea;border-top-color:#1E3A6B;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ld" id="ld"><div class="sp"></div><div style="font-weight:700">맞춤영양 코디 불러오는 중…</div></div>
<iframe id="af" title="맞춤영양 코디" allow="clipboard-write"></iframe>
<script>
/* 캐시 우회 로더(iframe 방식): 주소(index.html)를 바꾸지 않고 같은 페이지 안에서 앱을 iframe으로 로드.
   → 앱 웹뷰(A2U 등)가 '하위 페이지 이동'으로 보지 않아 상단 헤더·뒤로가기를 붙이지 않음.
   version.txt(캐시 안 함)로 최신 버전을 확인해 app.html?v=<버전>을 iframe에 로드. 버전 같으면 캐시 재사용(빠름), 바뀌면 새로 받음. */
(function(){
 var f=document.getElementById('af');
 f.onload=function(){ var l=document.getElementById('ld'); if(l)l.style.display='none'; };
 function go(v){ f.src='app.html?v=' + encodeURIComponent(v); }
 try{
  fetch('version.txt?_=' + Date.now(), {cache:'no-store'})
   .then(function(r){ return r.ok ? r.text() : Promise.reject(); })
   .then(function(t){ go(((t||'').trim()) || Date.now()); })
   .catch(function(){ go(Date.now()); });
 }catch(e){ go(Date.now()); }
})();
</script>
</body>
</html>
